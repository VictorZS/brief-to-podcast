name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Render the fictional example without audio
        run: python scripts/render_episode.py examples/episode.json --output output/ci --text-only
